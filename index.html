<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>1対1チャット</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{background:#f3f4f6;color:#111827}
    button,input{font:inherit}
    .app{height:100%;height:100dvh;display:flex;flex-direction:column;max-width:900px;margin:auto;background:#fff}
    header{height:58px;flex:none;display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid #e5e7eb}
    header h1{font-size:17px;margin:0;font-weight:700}
    .room{margin-left:auto;font-size:12px;color:#6b7280;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:45%}
    #messages{flex:1;overflow-y:auto;padding:14px;overscroll-behavior:contain;background:#f8fafc}
    .empty{text-align:center;color:#9ca3af;margin-top:30vh;font-size:14px}
    .row{display:flex;margin:6px 0}
    .row.me{justify-content:flex-end}
    .bubble{max-width:min(78%,560px);padding:9px 11px;border-radius:14px;background:#fff;border:1px solid #e5e7eb;box-shadow:0 1px 1px rgba(0,0,0,.03);white-space:pre-wrap;overflow-wrap:anywhere}
    .me .bubble{background:#e8f0ff;border-color:#d5e2ff}
    .meta{font-size:10px;color:#9ca3af;margin-top:4px}
    .me .meta{text-align:right}
    form{flex:none;display:flex;gap:8px;padding:10px max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));border-top:1px solid #e5e7eb;background:#fff}
    #text{flex:1;min-width:0;resize:none;height:42px;max-height:120px;padding:10px 12px;border:1px solid #d1d5db;border-radius:12px;outline:0}
    #text:focus{border-color:#93c5fd}
    #send{width:68px;border:0;border-radius:12px;background:#2563eb;color:#fff;font-weight:700}
    #send:disabled{opacity:.5}
    .setup{position:fixed;inset:0;background:#f3f4f6;display:flex;align-items:center;justify-content:center;padding:20px}
    .card{width:min(420px,100%);background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:22px;box-shadow:0 8px 30px rgba(0,0,0,.07)}
    .card h2{margin:0 0 8px;font-size:21px}
    .card p{font-size:13px;color:#6b7280;line-height:1.6}
    .card label{display:block;font-size:13px;font-weight:600;margin:16px 0 6px}
    .card input{width:100%;height:44px;border:1px solid #d1d5db;border-radius:10px;padding:0 12px;outline:0}
    .card button{width:100%;height:44px;margin-top:16px;border:0;border-radius:10px;background:#2563eb;color:#fff;font-weight:700}
    .error{color:#dc2626;font-size:12px;min-height:18px;margin-top:8px}
    .hidden{display:none!important}
    @media(min-width:901px){body{padding:12px}.app{border:1px solid #e5e7eb;border-radius:16px;overflow:hidden;height:calc(100dvh - 24px)}}
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>1対1チャット</h1>
      <div class="room" id="roomLabel"></div>
    </header>

    <main id="messages" aria-live="polite">
      <div class="empty" id="empty">メッセージはありません</div>
    </main>

    <form id="form">
      <textarea id="text" maxlength="2000" placeholder="メッセージを入力…" rows="1" autocomplete="off"></textarea>
      <button id="send" type="submit">送信</button>
    </form>
  </div>

  <div class="setup" id="setup">
    <div class="card">
      <h2>チャットを開始</h2>
      <p>このURLを共有した相手と、同じチャットルームで話せます。</p>
      <label for="name">あなたの名前</label>
      <input id="name" maxlength="30" placeholder="例：たろう" autocomplete="nickname">
      <div class="error" id="setupError"></div>
      <button id="start">チャットを開始</button>
    </div>
  </div>

<script>
/*
  ===========================
  サーバー設定
  ===========================
  このHTMLは「保存用サーバー」が別にある前提です。

  API_BASE が空なら、HTMLと同じドメインの
    GET  /api/messages?room=ROOM_ID
    POST /api/messages
  を使います。

  別サーバーなら例:
    const API_BASE = "https://example.com";
*/
const API_BASE = "";

const POLL_MS = 3000; // 3秒ごと。負荷を抑えるためWebSocketではなく軽量ポーリング。

const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);

let roomId = params.get("room");
let myName = localStorage.getItem("chat_name") || "";
let lastId = 0;
let loading = false;
let pollTimer = null;

function makeRoomId() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return Math.random().toString(36).slice(2) + Date.now().toString(36);
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

function formatTime(value) {
  const d = new Date(value);
  if (Number.isNaN(d.getTime())) return "";
  return d.toLocaleTimeString("ja-JP", {hour:"2-digit", minute:"2-digit"});
}

function showSetup() {
  $("setup").classList.remove("hidden");
  $("name").value = myName;
}

function startChat() {
  myName = $("name").value.trim();
  if (!myName) {
    $("setupError").textContent = "名前を入力してください。";
    return;
  }

  localStorage.setItem("chat_name", myName);

  if (!roomId) {
    roomId = makeRoomId();
    const url = new URL(location.href);
    url.searchParams.set("room", roomId);
    history.replaceState(null, "", url);
  }

  $("roomLabel").textContent = "ROOM: " + roomId;
  $("setup").classList.add("hidden");
  loadMessages(true);
  startPolling();
}

function addMessage(message) {
  const empty = $("empty");
  if (empty) empty.remove();

  const mine = message.name === myName;
  const row = document.createElement("div");
  row.className = "row" + (mine ? " me" : "");

  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.innerHTML =
    '<div>' + escapeHtml(message.text) + '</div>' +
    '<div class="meta">' + escapeHtml(message.name || "匿名") +
    ' · ' + formatTime(message.created_at) + '</div>';

  row.appendChild(bubble);
  $("messages").appendChild(row);
}

function renderMessages(messages) {
  $("messages").innerHTML = "";
  lastId = 0;

  if (!messages.length) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.id = "empty";
    empty.textContent = "メッセージはありません";
    $("messages").appendChild(empty);
    return;
  }

  for (const m of messages) {
    addMessage(m);
    if (Number(m.id) > lastId) lastId = Number(m.id);
  }
  scrollBottom();
}

function scrollBottom() {
  const box = $("messages");
  box.scrollTop = box.scrollHeight;
}

async function api(path, options = {}) {
  const res = await fetch(API_BASE + path, {
    ...options,
    headers: {
      "Content-Type": "application/json",
      ...(options.headers || {})
    },
    cache: "no-store"
  });

  if (!res.ok) throw new Error("HTTP " + res.status);
  return res.json();
}

async function loadMessages(initial = false) {
  if (loading) return;
  loading = true;

  try {
    const query = initial
      ? "?room=" + encodeURIComponent(roomId)
      : "?room=" + encodeURIComponent(roomId) + "&after=" + encodeURIComponent(lastId);

    const data = await api("/api/messages" + query);

    if (initial) {
      renderMessages(Array.isArray(data) ? data : data.messages || []);
    } else {
      const messages = Array.isArray(data) ? data : data.messages || [];
      if (messages.length) {
        const wasNearBottom =
          $("messages").scrollHeight - $("messages").scrollTop - $("messages").clientHeight < 120;

        for (const m of messages) {
          addMessage(m);
          if (Number(m.id) > lastId) lastId = Number(m.id);
        }

        if (wasNearBottom) scrollBottom();
      }
    }
  } catch (e) {
    console.error("メッセージ取得失敗:", e);
  } finally {
    loading = false;
  }
}

function startPolling() {
  clearInterval(pollTimer);
  pollTimer = setInterval(() => {
    if (!document.hidden) loadMessages(false);
  }, POLL_MS);
}

async function sendMessage(text) {
  const payload = {
    room: roomId,
    name: myName,
    text: text
  };

  await api("/api/messages", {
    method: "POST",
    body: JSON.stringify(payload)
  });

  await loadMessages(false);
}

$("start").addEventListener("click", startChat);

$("name").addEventListener("keydown", e => {
  if (e.key === "Enter") startChat();
});

$("form").addEventListener("submit", async e => {
  e.preventDefault();

  const input = $("text");
  const send = $("send");
  const text = input.value.trim();

  if (!text || send.disabled) return;

  send.disabled = true;
  input.value = "";

  try {
    await sendMessage(text);
  } catch (err) {
    console.error(err);
    alert("送信できませんでした。サーバーが起動しているか確認してください。");
    input.value = text;
  } finally {
    send.disabled = false;
    input.focus();
  }
});

$("text").addEventListener("input", () => {
  const el = $("text");
  el.style.height = "42px";
  el.style.height = Math.min(el.scrollHeight, 120) + "px";
});

// URLにroomがある場合はそのまま開始。
// 初回だけ名前入力を表示。
if (myName) {
  if (!roomId) {
    roomId = makeRoomId();
    const url = new URL(location.href);
    url.searchParams.set("room", roomId);
    history.replaceState(null, "", url);
  }
  $("roomLabel").textContent = "ROOM: " + roomId;
  $("setup").classList.add("hidden");
  loadMessages(true);
  startPolling();
} else {
  showSetup();
}
</script>
</body>
</html>
