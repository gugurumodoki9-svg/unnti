<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>シンプル音声通話（サーバー不要版）</title>
<style>
  :root{
    --bg:#111318;
    --card:#1b1e26;
    --accent:#4f8cff;
    --accent2:#2fd07a;
    --danger:#ff4f5e;
    --text:#e8eaf0;
    --sub:#8b90a0;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .card{
    background:var(--card);
    border-radius:16px;
    padding:26px 22px;
    width:100%;
    max-width:420px;
    box-shadow:0 8px 30px rgba(0,0,0,.35);
  }
  h1{ font-size:18px; margin:0 0 4px; }
  p.sub{ color:var(--sub); font-size:13px; margin:0 0 18px; }
  .tabs{ display:flex; gap:8px; margin-bottom:16px; }
  .tab{
    flex:1; text-align:center; padding:9px; border-radius:8px;
    background:#0f1116; color:var(--sub); font-size:13px; cursor:pointer;
    border:1px solid #2c303c;
  }
  .tab.active{ background:var(--accent); color:#fff; border-color:var(--accent); }
  .panel{ display:none; }
  .panel.active{ display:block; }
  label{ font-size:12px; color:var(--sub); display:block; margin:12px 0 6px; }
  textarea{
    width:100%; min-height:80px; padding:10px 12px; border-radius:8px;
    border:1px solid #2c303c; background:#0f1116; color:var(--text);
    font-size:12px; font-family:monospace; resize:vertical;
  }
  button{
    width:100%; padding:11px; border:none; border-radius:8px;
    font-size:14px; font-weight:600; cursor:pointer; margin-top:12px;
  }
  button:disabled{ opacity:.4; cursor:not-allowed; }
  button:active{ opacity:.8; }
  .btn-primary{ background:var(--accent); color:#fff; }
  .btn-copy{ background:#2c303c; color:var(--text); font-size:12px; padding:8px; }
  .btn-hangup{ background:var(--danger); color:#fff; }
  #status{
    margin-top:16px; padding:10px 12px; border-radius:8px;
    background:#0f1116; font-size:13px; color:var(--sub); min-height:20px;
  }
  .dot{
    display:inline-block; width:8px; height:8px; border-radius:50%;
    background:var(--sub); margin-right:6px; vertical-align:middle;
  }
  .dot.on{ background:var(--accent2); }
  .hidden{ display:none; }
  audio{ display:none; }
  .step{ font-size:12px; color:var(--sub); margin-top:4px; }

  .chatBox{
    margin-top:14px;
    border:1px solid #2c303c;
    border-radius:8px;
    background:#0f1116;
    display:flex;
    flex-direction:column;
    height:240px;
  }
  .chatMessages{
    flex:1;
    overflow-y:auto;
    padding:10px;
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .msg{
    max-width:75%;
    padding:7px 10px;
    border-radius:12px;
    font-size:13px;
    line-height:1.4;
    word-break:break-word;
  }
  .msg.me{
    align-self:flex-end;
    background:var(--accent);
    color:#fff;
    border-bottom-right-radius:3px;
  }
  .msg.them{
    align-self:flex-start;
    background:#22262f;
    color:var(--text);
    border-bottom-left-radius:3px;
  }
  .msg.sys{
    align-self:center;
    color:var(--sub);
    font-size:11px;
    background:transparent;
    padding:2px;
  }
  .chatInputRow{
    display:flex;
    gap:6px;
    padding:8px;
    border-top:1px solid #2c303c;
  }
  .chatInputRow input{
    flex:1;
    padding:9px 10px;
    border-radius:8px;
    border:1px solid #2c303c;
    background:#161a22;
    color:var(--text);
    font-size:13px;
  }
  .chatInputRow button{
    width:auto;
    margin:0;
    padding:9px 14px;
    background:var(--accent);
    color:#fff;
  }
</style>
</head>
<body>

<div class="card">
  <h1>シンプル音声通話</h1>
  <p class="sub">サーバーなし・Firebaseなし。接続用のコードをコピペし合うだけでP2Pで直接繋がるよ。</p>

  <div id="setup">
    <div class="tabs">
      <div class="tab active" id="tabCall">かける側</div>
      <div class="tab" id="tabJoin">受ける側</div>
    </div>

    <!-- かける側 -->
    <div class="panel active" id="panelCall">
      <button class="btn-primary" id="startCallBtn">招待コードを作る</button>

      <div id="callStep2" class="hidden">
        <label>① このコードを相手に送ってね</label>
        <textarea id="offerOut" readonly></textarea>
        <button class="btn-copy" id="copyOfferBtn">コピーする</button>

        <label>② 相手から届いた「応答コード」を貼り付けてね</label>
        <textarea id="answerIn" placeholder="ここに貼り付け"></textarea>
        <button class="btn-primary" id="connectBtn">接続する</button>
      </div>
    </div>

    <!-- 受ける側 -->
    <div class="panel" id="panelJoin">
      <label>① 相手から届いた「招待コード」を貼り付けてね</label>
      <textarea id="offerIn" placeholder="ここに貼り付け"></textarea>
      <button class="btn-primary" id="makeAnswerBtn">応答コードを作る</button>

      <div id="joinStep2" class="hidden">
        <label>② このコードを相手に送り返してね</label>
        <textarea id="answerOut" readonly></textarea>
        <button class="btn-copy" id="copyAnswerBtn">コピーする</button>
        <p class="step">相手が「接続する」を押したら自動で繋がるよ</p>
      </div>
    </div>
  </div>

  <div id="callArea" class="hidden">
    <div id="status"><span class="dot" id="dot"></span><span id="statusText">準備中...</span></div>

    <div class="chatBox">
      <div class="chatMessages" id="chatMessages"></div>
      <div class="chatInputRow">
        <input type="text" id="chatInput" placeholder="メッセージを入力..." disabled>
        <button id="chatSendBtn" disabled>送信</button>
      </div>
    </div>

    <button class="btn-hangup" id="hangupBtn">通話を終了</button>
  </div>

  <audio id="remoteAudio" autoplay playsinline></audio>
</div>

<script>
const $ = (id) => document.getElementById(id);

const servers = {
  iceServers: [
    { urls: "stun:stun.l.google.com:19302" },
    { urls: "stun:stun1.l.google.com:19302" }
  ]
};

let pc = null;
let localStream = null;
let dataChannel = null;

const setupEl = $("setup");
const callArea = $("callArea");
const statusText = $("statusText");
const dot = $("dot");
const remoteAudio = $("remoteAudio");
const chatMessages = $("chatMessages");
const chatInput = $("chatInput");
const chatSendBtn = $("chatSendBtn");

function setStatus(text, connected=false){
  statusText.textContent = text;
  dot.classList.toggle("on", connected);
}

// タブ切り替え
$("tabCall").addEventListener("click", () => switchTab("call"));
$("tabJoin").addEventListener("click", () => switchTab("join"));
function switchTab(which){
  $("tabCall").classList.toggle("active", which === "call");
  $("tabJoin").classList.toggle("active", which === "join");
  $("panelCall").classList.toggle("active", which === "call");
  $("panelJoin").classList.toggle("active", which === "join");
}

async function getMic(){
  localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
}

function appendMsg(text, kind){
  // kind: "me" | "them" | "sys"
  const div = document.createElement("div");
  div.className = "msg " + kind;
  div.textContent = text;
  chatMessages.appendChild(div);
  chatMessages.scrollTop = chatMessages.scrollHeight;
}

function setupDataChannel(channel){
  dataChannel = channel;
  dataChannel.onopen = () => {
    chatInput.disabled = false;
    chatSendBtn.disabled = false;
    appendMsg("チャットが繋がったよ", "sys");
  };
  dataChannel.onclose = () => {
    chatInput.disabled = true;
    chatSendBtn.disabled = true;
  };
  dataChannel.onmessage = (event) => {
    appendMsg(event.data, "them");
  };
}

function sendChatMessage(){
  const text = chatInput.value.trim();
  if(!text || !dataChannel || dataChannel.readyState !== "open") return;
  dataChannel.send(text);
  appendMsg(text, "me");
  chatInput.value = "";
}

chatSendBtn.addEventListener("click", sendChatMessage);
chatInput.addEventListener("keydown", (e) => {
  if(e.key === "Enter") sendChatMessage();
});

function newPeerConnection(){
  const conn = new RTCPeerConnection(servers);
  conn.ontrack = (event) => {
    remoteAudio.srcObject = event.streams[0];
    setStatus("通話中", true);
  };
  conn.ondatachannel = (event) => {
    setupDataChannel(event.channel);
  };
  conn.oniceconnectionstatechange = () => {
    const s = conn.iceConnectionState;
    if(s === "disconnected" || s === "failed" || s === "closed"){
      setStatus("接続が切れたよ");
    }
  };
  localStream.getTracks().forEach(track => conn.addTrack(track, localStream));
  return conn;
}

// ICE candidateが出揃うまで待ってからSDPを確定させる（手動コピペを1回で済ませるため）
function waitForIceGathering(conn){
  return new Promise((resolve) => {
    if(conn.iceGatheringState === "complete"){
      resolve();
      return;
    }
    function check(){
      if(conn.iceGatheringState === "complete"){
        conn.removeEventListener("icegatheringstatechange", check);
        resolve();
      }
    }
    conn.addEventListener("icegatheringstatechange", check);
  });
}

// ---------- かける側 ----------
$("startCallBtn").addEventListener("click", async () => {
  try{
    $("startCallBtn").disabled = true;
    setStatus("マイクの許可を取得中...");
    await getMic();

    pc = newPeerConnection();
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    await waitForIceGathering(pc);

    const code = btoa(JSON.stringify(pc.localDescription));
    $("offerOut").value = code;
    $("callStep2").classList.remove("hidden");
    setStatus("相手からの応答コードを待ってるよ");
  }catch(err){
    setStatus("エラー: " + err.message);
  }
});

$("copyOfferBtn").addEventListener("click", () => {
  $("offerOut").select();
  document.execCommand("copy");
  $("copyOfferBtn").textContent = "コピーしたよ！";
  setTimeout(() => $("copyOfferBtn").textContent = "コピーする", 1500);
});

$("connectBtn").addEventListener("click", async () => {
  try{
    const answerCode = $("answerIn").value.trim();
    if(!answerCode){ alert("応答コードを貼り付けてね"); return; }
    const answerDesc = JSON.parse(atob(answerCode));
    await pc.setRemoteDescription(new RTCSessionDescription(answerDesc));

    setupEl.classList.add("hidden");
    callArea.classList.remove("hidden");
    setStatus("接続中...");
  }catch(err){
    setStatus("エラー: コードが正しくないかも");
  }
});

// ---------- 受ける側 ----------
$("makeAnswerBtn").addEventListener("click", async () => {
  try{
    const offerCode = $("offerIn").value.trim();
    if(!offerCode){ alert("招待コードを貼り付けてね"); return; }
    $("makeAnswerBtn").disabled = true;

    setStatus("マイクの許可を取得中...");
    await getMic();

    pc = newPeerConnection();
    const offerDesc = JSON.parse(atob(offerCode));
    await pc.setRemoteDescription(new RTCSessionDescription(offerDesc));

    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    await waitForIceGathering(pc);

    const code = btoa(JSON.stringify(pc.localDescription));
    $("answerOut").value = code;
    $("joinStep2").classList.remove("hidden");

    setupEl.classList.add("hidden");
    callArea.classList.remove("hidden");
    setStatus("相手が接続するのを待ってるよ");
  }catch(err){
    setStatus("エラー: " + err.message);
  }
});

$("copyAnswerBtn").addEventListener("click", () => {
  $("answerOut").select();
  document.execCommand("copy");
  $("copyAnswerBtn").textContent = "コピーしたよ！";
  setTimeout(() => $("copyAnswerBtn").textContent = "コピーする", 1500);
});

// ---------- 終了 ----------
$("hangupBtn").addEventListener("click", () => {
  if(pc){ pc.close(); pc = null; }
  if(localStream){ localStream.getTracks().forEach(t => t.stop()); localStream = null; }

  // 入力欄リセット
  ["offerOut","answerIn","offerIn","answerOut"].forEach(id => $(id).value = "");
  $("callStep2").classList.add("hidden");
  $("joinStep2").classList.add("hidden");
  $("startCallBtn").disabled = false;
  $("makeAnswerBtn").disabled = false;

  callArea.classList.add("hidden");
  setupEl.classList.remove("hidden");
  switchTab("call");
  setStatus("待機中");
});
</script>
</body>
</html>
