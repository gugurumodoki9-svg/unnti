<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>1対1チャット + 音声通話</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{background:#f3f4f6;color:#111827}
button,input,textarea{font:inherit}
.app{height:100%;height:100dvh;max-width:900px;margin:auto;background:#fff;display:flex;flex-direction:column}
header{height:58px;flex:none;display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid #e5e7eb}
header h1{margin:0;font-size:17px}
.room{margin-left:auto;font-size:11px;color:#6b7280;max-width:42%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#messages{flex:1;overflow-y:auto;padding:14px;background:#f8fafc;overscroll-behavior:contain}
.empty{text-align:center;color:#9ca3af;margin-top:30vh;font-size:14px}
.row{display:flex;margin:6px 0}.row.me{justify-content:flex-end}
.bubble{max-width:min(78%,560px);padding:9px 11px;border-radius:14px;background:#fff;border:1px solid #e5e7eb;white-space:pre-wrap;overflow-wrap:anywhere}
.me .bubble{background:#e8f0ff;border-color:#d5e2ff}
.meta{font-size:10px;color:#9ca3af;margin-top:4px}.me .meta{text-align:right}
form{display:flex;gap:8px;padding:10px max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));border-top:1px solid #e5e7eb}
#text{flex:1;min-width:0;resize:none;height:42px;max-height:120px;padding:10px 12px;border:1px solid #d1d5db;border-radius:12px;outline:0}
#send,#call{border:0;border-radius:12px;color:#fff;font-weight:700}
#send{width:68px;background:#2563eb}.send-disabled{opacity:.5}
#call{width:52px;background:#16a34a}
.setup{position:fixed;inset:0;background:#f3f4f6;display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
.card{width:min(420px,100%);background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:22px;box-shadow:0 8px 30px rgba(0,0,0,.07)}
.card h2{margin:0 0 8px;font-size:21px}.card p{font-size:13px;color:#6b7280;line-height:1.6}
.card label{display:block;font-size:13px;font-weight:600;margin:16px 0 6px}
.card input{width:100%;height:44px;border:1px solid #d1d5db;border-radius:10px;padding:0 12px;outline:0}
.card button{width:100%;height:44px;margin-top:16px;border:0;border-radius:10px;background:#2563eb;color:#fff;font-weight:700}
.error{color:#dc2626;font-size:12px;min-height:18px;margin-top:8px}
.hidden{display:none!important}
.call-panel{position:fixed;right:16px;bottom:80px;width:min(330px,calc(100% - 32px));background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:16px;box-shadow:0 12px 35px rgba(0,0,0,.16);z-index:10}
.call-title{font-weight:700}.call-status{font-size:13px;color:#6b7280;margin:6px 0 14px}
.call-actions{display:flex;gap:8px}.call-actions button{flex:1;height:42px;border:0;border-radius:10px;color:#fff;font-weight:700}
.accept{background:#16a34a}.decline,.hangup{background:#dc2626}.mute{background:#374151}
@media(min-width:901px){body{padding:12px}.app{height:calc(100dvh - 24px);border:1px solid #e5e7eb;border-radius:16px;overflow:hidden}}
</style>
</head>
<body>

<div class="app">
<header>
<h1>1対1チャット</h1>
<div class="room" id="roomLabel"></div>
</header>

<main id="messages"><div class="empty" id="empty">メッセージはありません</div></main>

<form id="form">
<textarea id="text" maxlength="2000" placeholder="メッセージを入力…" rows="1"></textarea>
<button id="call" type="button" title="音声通話">📞</button>
<button id="send" type="submit">送信</button>
</form>
</div>

<div class="setup" id="setup">
<div class="card">
<h2>チャットを開始</h2>
<p>このURLを相手と共有してください。同じROOMでチャットと音声通話ができます。</p>
<label for="name">あなたの名前</label>
<input id="name" maxlength="30" placeholder="例：たろう" autocomplete="nickname">
<div class="error" id="setupError"></div>
<button id="start">チャットを開始</button>
</div>
</div>

<div class="call-panel hidden" id="callPanel">
<div class="call-title" id="callTitle">音声通話</div>
<div class="call-status" id="callStatus">接続準備中…</div>
<div class="call-actions" id="callActions"></div>
</div>

<audio id="remoteAudio" autoplay playsinline></audio>

<script>
/*
  ============================================================
  サーバーAPI
  ============================================================
  HTMLと同じサーバーなら空欄のまま使えます。

  必要なAPI:
    GET  /api/messages?room=ROOM_ID
    GET  /api/messages?room=ROOM_ID&after=ID
    POST /api/messages

  音声通話用:
    POST /api/signal
      { room, from, type, data }

    GET /api/signal?room=ROOM_ID&after=ID

  /api/signal はWebRTCのoffer / answer / ICE candidateを
  一時的に相手へ渡すだけの軽量なシグナリングAPIです。
*/
const API_BASE = "";
const POLL_MS = 3000;
const SIGNAL_POLL_MS = 1000;

const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);

// 固定チャットルームID
const FIXED_ROOM_ID = "ryo1031jun0106";
let roomId = FIXED_ROOM_ID;
let myName = localStorage.getItem("chat_name") || "";
let lastId = 0;
let lastSignalId = 0;
let loading = false;
let pollTimer = null;
let signalTimer = null;

let peer = null;
let localStream = null;
let callActive = false;
let muted = false;

const iceServers = [
  {urls:"stun:stun.l.google.com:19302"}
];

function makeRoomId(){
  return FIXED_ROOM_ID;
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function formatTime(value){
  const d=new Date(value);
  return Number.isNaN(d.getTime())?"":d.toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"});
}

async function api(path,options={}){
  const res=await fetch(API_BASE+path,{
    ...options,
    headers:{"Content-Type":"application/json",...(options.headers||{})},
    cache:"no-store"
  });
  if(!res.ok)throw new Error("HTTP "+res.status);
  return res.json();
}

function showSetup(){
  $("setup").classList.remove("hidden");
  $("name").value=myName;
}

function startChat(){
  myName=$("name").value.trim();
  if(!myName){$("setupError").textContent="名前を入力してください。";return;}
  localStorage.setItem("chat_name",myName);

  roomId = FIXED_ROOM_ID;
  const u=new URL(location.href);
  u.searchParams.set("room",roomId);
  history.replaceState(null,"",u);

  $("roomLabel").textContent="ROOM: "+roomId;
  $("setup").classList.add("hidden");
  loadMessages(true);
  startPolling();
  startSignalPolling();
}

function addMessage(m){
  const empty=$("empty"); if(empty)empty.remove();
  const row=document.createElement("div");
  row.className="row"+(m.name===myName?" me":"");
  const bubble=document.createElement("div");
  bubble.className="bubble";
  bubble.innerHTML="<div>"+escapeHtml(m.text)+"</div><div class='meta'>"+
    escapeHtml(m.name||"匿名")+" · "+formatTime(m.created_at)+"</div>";
  row.appendChild(bubble);
  $("messages").appendChild(row);
}

function renderMessages(list){
  $("messages").innerHTML="";
  lastId=0;
  if(!list.length){
    $("messages").innerHTML="<div class='empty' id='empty'>メッセージはありません</div>";
    return;
  }
  list.forEach(m=>{addMessage(m);lastId=Math.max(lastId,Number(m.id)||0)});
  scrollBottom();
}

function scrollBottom(){
  const box=$("messages");
  box.scrollTop=box.scrollHeight;
}

async function loadMessages(initial=false){
  if(loading)return;
  loading=true;
  try{
    const q="?room="+encodeURIComponent(roomId)+(initial?"":"&after="+encodeURIComponent(lastId));
    const data=await api("/api/messages"+q);
    const list=Array.isArray(data)?data:(data.messages||[]);
    if(initial)renderMessages(list);
    else if(list.length){
      const near=$("messages").scrollHeight-$("messages").scrollTop-$("messages").clientHeight<120;
      list.forEach(m=>{addMessage(m);lastId=Math.max(lastId,Number(m.id)||0)});
      if(near)scrollBottom();
    }
  }catch(e){console.error(e)}
  finally{loading=false}
}

function startPolling(){
  clearInterval(pollTimer);
  pollTimer=setInterval(()=>{if(!document.hidden)loadMessages(false)},POLL_MS);
}

/* ---------------- WebRTC signaling ---------------- */

async function sendSignal(type,data){
  await api("/api/signal",{
    method:"POST",
    body:JSON.stringify({room:roomId,from:myName,type,data})
  });
}

async function pollSignals(){
  try{
    const data=await api("/api/signal?room="+encodeURIComponent(roomId)+"&after="+encodeURIComponent(lastSignalId));
    const list=Array.isArray(data)?data:(data.signals||[]);
    for(const s of list){
      lastSignalId=Math.max(lastSignalId,Number(s.id)||0);
      if(s.from===myName)continue;
      await handleSignal(s);
    }
  }catch(e){console.error("signal",e)}
}

function startSignalPolling(){
  clearInterval(signalTimer);
  signalTimer=setInterval(()=>{if(!document.hidden)pollSignals()},SIGNAL_POLL_MS);
  pollSignals();
}

async function createPeer(){
  if(peer)return peer;
  peer=new RTCPeerConnection({iceServers});

  peer.onicecandidate=async e=>{
    if(e.candidate){
      try{await sendSignal("ice",e.candidate)}catch(err){console.error(err)}
    }
  };

  peer.ontrack=e=>{
    $("remoteAudio").srcObject=e.streams[0];
  };

  peer.onconnectionstatechange=()=>{
    const state=peer.connectionState;
    if(state==="connected"){
      $("callStatus").textContent="通話中";
      callActive=true;
    }else if(["failed","disconnected","closed"].includes(state)){
      if(callActive)endCall(false);
    }
  };

  return peer;
}

async function startCall(){
  if(callActive)return;

  try{
    localStream=await navigator.mediaDevices.getUserMedia({
      audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true},
      video:false
    });

    await createPeer();
    localStream.getTracks().forEach(t=>peer.addTrack(t,localStream));

    const offer=await peer.createOffer();
    await peer.setLocalDescription(offer);
    await sendSignal("offer",offer);

    showCallPanel("発信中","相手の応答を待っています…",[
      ["hangup","通話終了",()=>endCall(true)]
    ]);
  }catch(e){
    console.error(e);
    alert("マイクを使用できませんでした。ブラウザのマイク許可を確認してください。");
    endCall(false);
  }
}

async function receiveOffer(offer){
  if(callActive)return;

  showCallPanel("着信","音声通話の着信があります。",[
    ["accept","応答",()=>acceptCall(offer)],
    ["decline","拒否",()=>sendSignal("decline",{name:myName}).finally(()=>hideCallPanel())]
  ]);
}

async function acceptCall(offer){
  try{
    localStream=await navigator.mediaDevices.getUserMedia({
      audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true},
      video:false
    });

    await createPeer();
    localStream.getTracks().forEach(t=>peer.addTrack(t,localStream));

    await peer.setRemoteDescription(offer);
    const answer=await peer.createAnswer();
    await peer.setLocalDescription(answer);
    await sendSignal("answer",answer);

    showCallPanel("音声通話","接続中…",[
      ["mute","🔇 ミュート",toggleMute],
      ["hangup","通話終了",()=>endCall(true)]
    ]);
  }catch(e){
    console.error(e);
    alert("マイクを使用できませんでした。");
    endCall(false);
  }
}

async function handleSignal(s){
  if(s.type==="offer"){
    await receiveOffer(s.data);
    return;
  }

  if(!peer)return;

  if(s.type==="answer"){
    try{
      await peer.setRemoteDescription(s.data);
      $("callStatus").textContent="接続中…";
    }catch(e){console.error(e)}
  }

  if(s.type==="ice"){
    try{
      await peer.addIceCandidate(s.data);
    }catch(e){console.error(e)}
  }

  if(s.type==="decline"){
    $("callStatus").textContent="相手が通話を拒否しました";
    setTimeout(()=>endCall(false),1200);
  }

  if(s.type==="hangup"){
    endCall(false);
  }
}

function showCallPanel(title,status,actions){
  $("callPanel").classList.remove("hidden");
  $("callTitle").textContent=title;
  $("callStatus").textContent=status;
  const box=$("callActions");
  box.innerHTML="";
  actions.forEach(([cls,label,fn])=>{
    const b=document.createElement("button");
    b.className=cls;b.textContent=label;b.onclick=fn;box.appendChild(b);
  });
}

function hideCallPanel(){
  $("callPanel").classList.add("hidden");
}

function toggleMute(){
  if(!localStream)return;
  muted=!muted;
  localStream.getAudioTracks().forEach(t=>t.enabled=!muted);
  const buttons=$("callActions").querySelectorAll("button");
  buttons.forEach(b=>{if(b.classList.contains("mute"))b.textContent=muted?"🔊 ミュート解除":"🔇 ミュート"});
}

async function endCall(notify){
  if(notify){
    try{await sendSignal("hangup",{name:myName})}catch(e){}
  }

  if(localStream){
    localStream.getTracks().forEach(t=>t.stop());
    localStream=null;
  }

  if(peer){
    peer.close();
    peer=null;
  }

  $("remoteAudio").srcObject=null;
  callActive=false;
  muted=false;
  hideCallPanel();
}

/* ---------------- UI ---------------- */

$("start").onclick=startChat;
$("name").onkeydown=e=>{if(e.key==="Enter")startChat()};

$("form").onsubmit=async e=>{
  e.preventDefault();
  const input=$("text"),send=$("send");
  const text=input.value.trim();
  if(!text||send.disabled)return;

  send.disabled=true;
  input.value="";
  try{
    await api("/api/messages",{
      method:"POST",
      body:JSON.stringify({room:roomId,name:myName,text})
    });
    await loadMessages(false);
  }catch(err){
    alert("送信できませんでした。");
    input.value=text;
  }finally{
    send.disabled=false;input.focus();
  }
};

$("text").oninput=()=>{
  const el=$("text");
  el.style.height="42px";
  el.style.height=Math.min(el.scrollHeight,120)+"px";
};

$("call").onclick=startCall;

window.addEventListener("beforeunload",()=>{
  if(peer)peer.close();
  if(localStream)localStream.getTracks().forEach(t=>t.stop());
});

if(myName){
  const u=new URL(location.href);
  if(u.searchParams.get("room") !== FIXED_ROOM_ID){
    u.searchParams.set("room", FIXED_ROOM_ID);
    history.replaceState(null,"",u);
  }
  roomId = FIXED_ROOM_ID;
  $("roomLabel").textContent="ROOM: "+roomId;
  $("setup").classList.add("hidden");
  loadMessages(true);
  startPolling();
  startSignalPolling();
}else{
  showSetup();
}
</script>
</body>
</html>
